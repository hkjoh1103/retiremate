<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{META}}
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

</head>
<body>
<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-30 border-b border-border bg-background/90 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-[1200px] items-center gap-8 px-5">
      <a class="flex items-center" href="/" aria-label="ReMate 홈"><img src="/assets/logo.svg" alt="ReMate" width="106" height="20" style="height:20px;width:auto"></a>
      <nav class="hidden h-full items-center gap-6 sm:flex">
        <a class="flex h-full items-center border-b-2 border-transparent text-sm text-muted-foreground data-[status=active]:border-foreground data-[status=active]:font-semibold data-[status=active]:text-foreground" href="/">계산기</a>
        <a class="flex h-full items-center border-b-2 border-transparent text-sm text-muted-foreground data-[status=active]:border-foreground data-[status=active]:font-semibold data-[status=active]:text-foreground" href="/blog/" data-status="active" aria-current="page">블로그</a>
      </nav>
      <button class="ml-auto sm:hidden" aria-label="메뉴" id="menu-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>
    </div>
    <nav id="mobile-nav" class="border-t border-border px-5 py-2 sm:hidden" hidden>
      <a class="block py-3 text-base text-muted-foreground data-[status=active]:font-semibold data-[status=active]:text-foreground" href="/">계산기</a>
      <a class="block py-3 text-base text-muted-foreground data-[status=active]:font-semibold data-[status=active]:text-foreground" href="/blog/" data-status="active" aria-current="page">블로그</a>
    </nav>
  </header>
  <main class="flex-1" id="content">{{MAIN}}</main>
  <footer class="mt-20 bg-surface">
    <div class="mx-auto grid max-w-[1200px] gap-5 px-5 py-10 sm:grid-cols-[1fr_auto]">
      <div class="space-y-2 text-sm text-muted-foreground">
        <a class="flex items-center" href="/" aria-label="ReMate 홈"><img src="/assets/logo.svg" alt="ReMate" width="106" height="20" style="height:20px;width:auto"></a>
        <p>은퇴, 같이 이야기해요.</p>
        <p><b class="text-foreground">문의</b> hello@retire-mates.com</p>
        <p class="text-xs">© 2026 ReMate · retire-mates.com</p>
      </div>
      <div class="flex gap-2 self-start">
        <a href="https://instagram.com" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1 rounded-full border border-border bg-card px-4 py-2 text-xs">인스타그램<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3 w-3" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
        <a href="https://blog.naver.com" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1 rounded-full border border-border bg-card px-4 py-2 text-xs">네이버 블로그<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3 w-3" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
      </div>
    </div>
  </footer>
</div>

<script src="/site.js"></script>
<script>
document.getElementById('share').addEventListener('click', async () => {
  const url = location.href, title = document.querySelector('h1').textContent;
  track('share', { post_slug: location.pathname.split('/')[2], method: navigator.share ? 'native' : 'copy' });
  if (navigator.share) await navigator.share({ title, url }).catch(() => {});
  else { await navigator.clipboard.writeText(url); alert('링크를 복사했어요'); }
});
</script>
</body>
</html>
