<script src="/posts.js"></script>
<script src="/site.js"></script>
<script>

// 추천 글 캐러셀
const featured = document.getElementById('featured');
featured.innerHTML = POSTS.filter((p) => p.featured)
  .map((p) => `<div class="shrink-0 snap-start sm:w-[62%]">${PostCard(p)}</div>`).join('');
document.getElementById('carousel-btns').innerHTML = [-1, 1].map((d) =>
  `<button data-dir="${d}" aria-label="${d < 0 ? '이전' : '다음'}" class="grid h-9 w-9 place-items-center rounded-full border border-border bg-card">${d < 0 ? ICON.chevronLeft('h-4 w-4') : ICON.chevronRight('h-4 w-4')}</button>`).join('');
document.querySelectorAll('#carousel-btns button').forEach((b) => b.addEventListener('click', () =>
  featured.scrollBy({ left: Number(b.dataset.dir) * featured.clientWidth * 0.66, behavior: 'smooth' })));

// 카테고리 필터
let selected = '전체';
function renderAll() {
  document.getElementById('filters').innerHTML = ['전체', ...CATEGORIES].map((c) =>
    `<button data-cat="${c}" class="rounded-full border px-3.5 py-1.5 text-sm ${c === selected ? 'border-primary bg-primary text-primary-foreground' : 'border-border bg-card'}">${c}</button>`).join('');
  document.querySelectorAll('#filters button').forEach((b) => b.addEventListener('click', () => { selected = b.dataset.cat; renderAll(); }));
  const list = selected === '전체' ? POSTS : POSTS.filter((p) => p.category === selected);
  document.getElementById('all-posts').innerHTML = list.map((p) => PostCard(p)).join('');
}
renderAll();
</script>
